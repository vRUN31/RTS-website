<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #dedede 0%, #f6f6f6 100%);
            font-family: 'Playfair Display', 'Georgia', serif;
            box-sizing: border-box;
        }

        .page-transition {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #dedede;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 9999;
        }

        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Playfair Display', 'Georgia', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 48px;
            transition: background 0.3s;
        }

        .logo-text {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            color: #1a2b1a;
            letter-spacing: 2.5px;
            margin-bottom: 2.5rem;
            font-variant: small-caps;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0,0,0,0.07);
        }

        .logo-text sup {
            font-size: 1.2rem;
            font-family: Arial, sans-serif;
            color: #222;
            font-weight: 400;
        }

        main {
            background: linear-gradient(120deg, #f6f6f6 80%, #e3e3e3 100%);
            border-radius: 32px;
            box-shadow: 0 6px 32px rgba(0,0,0,0.08);
            padding: 40px 40px 28px 40px;
            width: 440px;
            max-width: 95vw;
            margin-bottom: 32px;
            border: 1px solid #e3e3e3;
            animation: fadeInMain 0.7s;
        }

        @keyframes fadeInMain {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h4 {
            font-family: 'Playfair Display', serif;
            font-size: 2.1rem;
            font-weight: 400;
            color: #222;
            text-align: center;
            margin: 0 0 12px 0;
            letter-spacing: 1px;
        }

        h4:nth-child(2) {
            font-size: 1.15rem;
            color: #666;
            margin-bottom: 24px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .input-label {
            font-size: 1.08rem;
            color: #222;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid #e3e3e3;
            border-radius: 12px;
            background: #f7f7f7;
            font-size: 1.08rem;
            font-family: 'Playfair Display', serif;
            color: #222;
            margin-bottom: 0;
            outline: none;
            box-sizing: border-box;
            transition: border 0.2s, box-shadow 0.2s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            background: #fff;
            border: 1.5px solid #ff4d00;
            box-shadow: 0 2px 8px rgba(255,77,0,0.08);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 0.95rem;
        }

        .forgot-password a {
            color: #ff4d00;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .forgot-password a:hover {
            color: #d13c00;
            text-decoration: underline;
        }

        button[type="submit"] {
            background: linear-gradient(90deg, #ff4d00 60%, #ff7c3a 100%);
            color: #fff;
            border: none;
            border-radius: 2rem;
            padding: 0.8rem 0;
            font-size: 1.5rem;
            font-family: 'Playfair Display', serif;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s, box-shadow 0.2s;
            width: 100%;
            box-shadow: 0 2px 12px rgba(255,77,0,0.08);
        }

        button[type="submit"]:hover {
            background: linear-gradient(90deg, #d13c00 60%, #ff4d00 100%);
            box-shadow: 0 4px 16px rgba(255,77,0,0.13);
        }

        .divider {
            position: relative;
            text-align: center;
            margin: 24px 0;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #bbb;
            z-index: 1;
        }

        .divider-text {
            background: #f6f6f6;
            padding: 0 16px;
            color: #666;
            position: relative;
            z-index: 2;
            font-size: 1.1rem;
        }

        .social-login {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
        }

        .social-btn {
            background: #fff;
            color: #222;
            border: 1.5px solid #e3e3e3;
            border-radius: 18px;
            padding: 10px 28px;
            font-size: 1.1rem;
            font-family: 'Playfair Display', serif;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .social-btn:hover {
            background: #f3f3f3;
            color: #ff4d00;
            border-color: #ff4d00;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 0.95rem;
        }

        .signup-link a {
            color: #ff4d00;
            text-decoration: none;
            transition: color 0.2s;
        }

        .signup-link a:hover {
            color: #d13c00;
            text-decoration: underline;
        }

        .role-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            justify-content: center;
        }

        .role-options {
            display: flex;
            gap: 12px;
        }

        .role-radio {
            display: none;
        }

        .role-btn {
            background: #fff;
            border: 1.5px solid #ccc;
            border-radius: 16px;
            padding: 7px 22px;
            font-size: 1.08rem;
            font-family: 'Playfair Display', serif;
            color: #222;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }

        .role-radio:checked + .role-btn {
            background: #e3e3e3;
            border: 2px solid #ff4d00;
            color: #ff4d00;
            box-shadow: 0 2px 8px rgba(255,77,0,0.08);
        }

        p {
            margin: 0;
        }

        /* Custom scrollbar for main */
        main::-webkit-scrollbar {
            width: 8px;
            background: #e3e3e3;
        }
        main::-webkit-scrollbar-thumb {
            background: #ff4d00;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <button id="backHomeBtn" type="button" aria-label="Back to Home" style="position: absolute; top: 24px; left: 24px; background: transparent; border: none; cursor: pointer; z-index: 100; padding: 0;">
        <svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="19" cy="19" r="19" fill="#dedede" stroke="#ccc" stroke-width="1.5"/>
            <path d="M22 13L16 19L22 25" stroke="#ff4d00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>
    <div class="logo-text">RTS</div>
    <main>
        <h4>Login</h4>
        <h4 id="role-specific-message">Select your role to continue</h4>
        
        <form action="/login" method="POST">
            <div class="role-group">
                <div class="role-options">
                    <input type="radio" id="role-admin" name="role" value="admin" class="role-radio" required checked>
                    <label for="role-admin" class="role-btn">Admin</label>
                    <input type="radio" id="role-customer" name="role" value="customer" class="role-radio">       
                    <label for="role-customer" class="role-btn">Customer</label>
                </div>
            </div>

            <div>
                <input type="email" name="email" required placeholder="Email">
            </div>
            <div>
                <input type="password" name="password" required placeholder="Password">
            </div>
            <div class="remember-forgot">
                <div class="remember-me">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <label for="rememberMe">Remember Me</label>
                </div>
                <div class="forgot-password">
                    <a href="forgot_password.html">Forgot Password?</a>
                </div>
            </div>
            <button type="submit">Continue</button>
            <div class="divider">
                <span class="divider-text">Or Continue with:</span>
            </div>
            <div class="social-login">
                <button type="button" class="social-btn">Continue with Google</button>
                <button type="button" class="social-btn">Continue with Microsoft</button>
                <button type="button" class="social-btn">Continue with Apple</button>
            </div>
            <div class="signup-link">
                <p>Don't have an account? <a href="register.html">Sign Up</a></p>
            </div>
        </form>
    </main>
    <div class="page-transition"></div>
    <script>
        const roleMessages = {
            'admin': 'Login for administrators and staff',
            'customer': 'Login for customers and users'
        };

        document.querySelectorAll('.role-radio').forEach(radio => {
            radio.addEventListener('change', (e) => {
                const messageElement = document.getElementById('role-specific-message');
                messageElement.textContent = roleMessages[e.target.value];
            });
        });

        // Set initial message based on default selected role
        const initialRole = document.querySelector('.role-radio:checked');
        if (initialRole) {
            document.getElementById('role-specific-message').textContent = roleMessages[initialRole.value];
        }

        function handlePageTransition(targetUrl) {
            const overlay = document.querySelector('.page-transition');
            overlay.style.opacity = '1';
            
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 300);
        }

        // Add transitions to all links and buttons
        document.querySelectorAll('a, button[onclick]').forEach(element => {
            if (element.hasAttribute('onclick')) {
                const url = element.getAttribute('onclick').replace("window.location.href='", '').replace("'", '');
                element.removeAttribute('onclick');
                element.addEventListener('click', () => handlePageTransition(url));
            } else if (element.href && !element.href.includes('javascript:')) {
                const url = element.href;
                element.addEventListener('click', (e) => {
                    e.preventDefault();
                    handlePageTransition(url);
                });
            }
        });

        // Back arrow event
        document.getElementById('backHomeBtn').addEventListener('click', function() {
            handlePageTransition('home.html');
        });

        // Add fade-in effect when page loads
        window.addEventListener('load', () => {
            document.body.style.opacity = '0';
            setTimeout(() => {
                document.body.style.transition = 'opacity 0.3s ease';
                document.body.style.opacity = '1';
            }, 0);
        });
    </script>
</body>
</html>
