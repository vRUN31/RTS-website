<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTS</title>
    <!-- Google Fonts for elegant serif -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
</head>
<style>
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #dedede;
        font-family: 'Georgia', serif;
        box-sizing: border-box;
    }
    
    /* Add transition overlay */
    .page-transition {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #dedede;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
        z-index: 9999;
    }

    body {
        min-height: 100vh;
        width: 100vw;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
    }
    header {
        text-align: center;
        margin-top: 32px;
        font-size: 2rem;
        color: #222;
        font-family: 'Georgia', serif;
        letter-spacing: 0.5px;
        font-weight: 400;
    }
    main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 600px;
        margin-top: 0;
    }
    .truly {
        font-size: 2.1rem;
        margin-bottom: 2.2rem;
        color: #222;
        text-align: center;
        font-weight: 400;
    }
    .logo-text {
        font-size: 3.2rem;
        font-family: 'Qestero', 'Raleway', serif;
        color: #1a2b1a;
        letter-spacing: 3px;
        margin-bottom: 3.5rem;
        margin-top: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 400;
        font-variant: small-caps;
        text-transform: uppercase;
    }
    .logo-text sup {
        font-size: 2.1rem;
        margin-left: 0.2rem;
        font-family: Arial, sans-serif;
        color: #222;
        font-weight: 400;
        letter-spacing: 0;
    }
    .auth-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        margin-top: 0;
    }
    .auth-row {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        justify-content: center;
        gap: 40px;
    }
    .auth-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 240px;
    }
    .auth-section h4 {
        font-size: 1.35rem;
        font-weight: normal;
        margin-bottom: 1.5rem;
        color: #222;
        letter-spacing: 0.2px;
    }
    .auth-section button {
        background: #ff4d00;
        color: #fff;
        border: none;
        border-radius: 2rem;
        padding: 0.9rem 3.2rem;
        font-size: 1.7rem;
        font-family: 'Georgia', serif;
        cursor: pointer;
        margin-top: 0.5rem;
        transition: background 0.2s;
        box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .auth-section button:hover {
        background: #d13c00;
    }
    .guest-section {
        margin-top: 20px;
        text-align: center;
    }
    .guest-section button {
        background: transparent;
        color: #555;
        border: 2px solid #999;
        border-radius: 2rem;
        padding: 0.7rem 2.8rem;
        font-size: 1.5rem;
        font-family: 'Georgia', serif;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: none;
    }
    .guest-section button:hover {
        background: #f0f0f0;
        border-color: #666;
        color: #333;
    }
    .guest-section h4 {
        font-size: 1.25rem;
        font-weight: normal;
        margin-bottom: 1.2rem;
        color: #444;
        letter-spacing: 0.2px;
    }
    .divider {
        width: 1px;
        background: #888;
        height: 160px;
        align-self: center;
        margin: 0 18px;
    }
    footer {
        text-align: center;
        margin-top: 40px;
        color: #222;
        font-size: 1rem;
        font-family: 'Georgia', serif;
    }
</style>
</head>
<body>
    <div class="page-transition"></div>
    <header>
        
    <div class="truly">Delivering Trust, Safety, and Speed Across Every Journey</div>
    </header>
    <main>
    <div style="font-size:1.5rem; color:#333; margin-bottom:0.7rem; font-family:'Georgia',serif; font-weight:400;">Welcome To,</div>
        <div class="logo-text">RAJMOHAN TRANSPORT SERVICES</div>
        <div class="auth-container">
            <div class="auth-row">
                <div class="auth-section">
                    <h4>New Member?</h4>
                    <button onclick="window.location.href='register.html'">Sign Up</button>
                </div>
                <div class="divider"></div>
                <div class="auth-section">
                    <h4>Already a Member?</h4>
                    <button onclick="window.location.href='login.html'">Login</button>
                </div>
            </div>
            <div class="guest-section">
                <h4>Just want to explore? No Problem.<br>Continue as,</h4>
                <button>Guest</button>
            </div>
        </div>
    </main>
    <footer>
        <div>&copy; YOURS. All rights reserved.</div>
    </footer>
    <div class="page-transition"></div>
    <script>
        function handlePageTransition(targetUrl) {
            const overlay = document.querySelector('.page-transition');
            overlay.style.opacity = '1';
            
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 300); // Match this with the CSS transition duration
        }

        // Update all navigation buttons to use the transition
        document.querySelectorAll('button[onclick]').forEach(button => {
            const url = button.getAttribute('onclick').replace("window.location.href='", '').replace("'", '');
            button.removeAttribute('onclick');
            button.addEventListener('click', () => handlePageTransition(url));
        });

        // For the guest button (when implemented)
        const guestButton = document.querySelector('.guest-section button');
        if (guestButton) {
            guestButton.addEventListener('click', () => {
                // Add guest page URL when implemented
                handlePageTransition('guest.html');
            });
        }

        // Add fade-in effect when page loads
        window.addEventListener('load', () => {
            document.body.style.opacity = '0';
            setTimeout(() => {
                document.body.style.transition = 'opacity 0.3s ease';
                document.body.style.opacity = '1';
            }, 0);
        });
    </script>
</body>
</html>
